[workspace]
members = ["crates/parsh-wasm", "crates/parsh-coreutils"]
default-members = ["."]
resolver = "3"

[package]
name = "parsh"
version = "0.1.0"
edition = "2024"
description = "A shell built around S-expressions."
repository = "https://github.com/jmjoy/parsh"
license = "MulanPSL-2.0"
readme = "README.md"
keywords = ["shell", "sexp", "s-expression"]
categories = ["command-line-utilities"]

[features]
default = ["native"]
native = ["dep:clap", "dep:crossterm", "dep:nix", "dep:signal-hook"]

[[bin]]
name = "parsh"
path = "src/main.rs"
required-features = ["native"]

[[test]]
name = "scripts"
required-features = ["native"]

[[test]]
name = "terminal"
required-features = ["native"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
crossterm = { version = "0.29", optional = true }
glob = "0.3"
nix = { version = "0.31", features = ["fs", "process", "signal", "term"], optional = true }
signal-hook = { version = "0.3", optional = true }
unicode-segmentation = "1.13"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
