name: Website

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  ASTRO_TELEMETRY_DISABLED: "1"

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2
          run_install: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Check native and portable Rust
        run: |
          cargo fmt --all --check
          cargo test --locked
          cargo test --locked --no-default-features --lib
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --no-default-features --lib -- -D warnings
          cargo clippy --locked -p parsh-coreutils --target wasm32-wasip1 -- -D warnings
          cargo clippy --locked -p parsh-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Cache wasm-pack
        id: wasm-pack
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ${{ runner.os }}-wasm-pack-0.13.1
      - name: Install wasm-pack
        if: steps.wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Install website dependencies
        run: pnpm install --frozen-lockfile
      # wasm-pack downloads a wasm-bindgen binary on first use. Cache it here and not
      # under target/: Swatinem/rust-cache deletes loose files from non-profile
      # directories in target/ before saving, which left an empty
      # `target/wasm-pack-cache/wasm-bindgen-*` directory behind and broke every later
      # build with "wasm-bindgen binary does not exist".
      - name: Cache wasm-bindgen
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/.wasm-pack
          key: ${{ runner.os }}-wasm-bindgen-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-bindgen-
      - name: Check and build website
        run: |
          pnpm check
          pnpm build
      # Runner images already ship Chrome and Chromium, and playwright.config.ts
      # feeds PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH into launchOptions.executablePath,
      # so CI never downloads a browser: no CDN hop, no ~273 MB cache entry.
      # Trade-off: the browser version tracks the image (rebuilt weekly) instead of
      # the Playwright release. If the image ever drops both, fall back to
      # `playwright install --only-shell chromium` here.
      - name: Use preinstalled browser
        run: |
          browser=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$browser" ]; then
            echo "no preinstalled Chrome/Chromium, installing Playwright headless shell"
            pnpm --filter parsh-website exec playwright install --only-shell chromium
          else
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser" >> "$GITHUB_ENV"
            "$browser" --version
          fi
      - name: Test production website
        run: pnpm test
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-diagnostics
          path: |
            website/playwright-report
            website/test-results
          if-no-files-found: ignore
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
