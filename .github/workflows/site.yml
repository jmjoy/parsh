name: Website

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  ASTRO_TELEMETRY_DISABLED: "1"

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2
          run_install: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Check native and portable Rust
        run: |
          cargo fmt --all --check
          cargo test --locked
          cargo test --locked --no-default-features --lib
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --no-default-features --lib -- -D warnings
          cargo clippy --locked -p parsh-coreutils --target wasm32-wasip1 -- -D warnings
          cargo clippy --locked -p parsh-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Cache wasm-pack
        id: wasm-pack
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ${{ runner.os }}-wasm-pack-0.13.1
      - name: Install wasm-pack
        if: steps.wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Install website dependencies
        run: pnpm install --frozen-lockfile
      - name: Check and build website
        run: |
          pnpm check
          pnpm build
      - name: Install test browser
        run: pnpm --filter parsh-website exec playwright install --with-deps chromium
      - name: Test production website
        run: pnpm test
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-diagnostics
          path: |
            website/playwright-report
            website/test-results
          if-no-files-found: ignore
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
