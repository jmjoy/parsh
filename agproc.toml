# Run `agproc skills` before managing the local website service.
[[service]]
name = "website"
build-cmd = ["env", "ASTRO_TELEMETRY_DISABLED=1", "pnpm", "build"]
run-cmd = ["env", "ASTRO_TELEMETRY_DISABLED=1", "pnpm", "preview", "--port", "4321"]
probe = { http-get = { scheme = "http", host = "127.0.0.1", port = 4321, path = "/parsh/en/" }, initial-delay-seconds = 2, period-seconds = 1, timeout-seconds = 2, failure-threshold = 10 }
